<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Hermetic font set for the Faz mockups: only the static TTFs in ./files.
     prefix="relative" on <dir> is relative to this file; on <cachedir> it would follow the
     current directory, so the cache goes to the XDG cache dir. -->
<fontconfig>
  <dir prefix="relative">files</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
